name: Learning Management System
on:
  push:
    branches:
      - main
jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms-db
        ports:
          - "5432: 5432"
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Install python
          uses: actions/setup-python@v5
          with:
            python-version: '3.9'
        - working-directory: lms-backend
        - name: Install Dependencies
          run: pip install -r requirements.txt
        - name: Run tests
          env:
            PGHOST: localhost
            PGPORT: 5432
            PGUSER: postgres
            PGPASSWORD: postgres
            PGDATABASE: lms-db
          run: python manage.py test
      
  frontend-test
    runs-on: ubuntu-latest
    steps:
      - checkout
      - setup-node
      - working-directory: lms-frontend
      - npm install
      - npm test        
   
